[package]
name = "kestrel-chartkit"
version = "0.12.2"
edition = "2021"
description = "High-performance Rust technical analysis library for indicator math, market regime classification, composite scoring, and SVG visualization."
license = "BUSL-1.1"
repository = "https://github.com/casoon/kestrel-chartkit"
homepage = "https://casoon.github.io/kestrel-chartkit/"
documentation = "https://docs.rs/kestrel-chartkit"
keywords = ["trading", "technical-analysis", "indicators", "charting", "signals"]
categories = ["finance", "visualization"]
readme = "README.md"
# The reference generator only produces tests/fixtures/; it is not part of the library.
# site/, docs/ and examples/site/ make up the project website. .judge/, judge.md, CLAUDE.md and
# .github/ are repository tooling.
exclude = [
    "reference/",
    "site/",
    "docs/",
    "examples/site/",
    ".judge/",
    "judge.md",
    "CLAUDE.md",
    ".github/",
]
rust-version = "1.87"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
# IANA timezone/DST-aware exchange calendars (src/calendar.rs). Optional: the core crate has no
# timezone-database dependency unless this is enabled.
calendar = ["dep:chrono", "dep:chrono-tz"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "indicators"
harness = false

# Document the optional `calendar` module (ExchangeCalendar) on docs.rs as well.
[package.metadata.docs.rs]
all-features = true
