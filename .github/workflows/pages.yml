name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Every chart on the site is a chartlet specification computed by the crate itself;
      # the example writes them into site/.generated/ (not committed), so it runs before the
      # site build.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate charts
        run: cargo run --release --example site_showcase

      # Project repos have no package.json at the root, so the pnpm version is set here.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - uses: actions/configure-pages@v6

      - name: Build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
